<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<title>Gemini</title>
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{--bg:#0d0f14;--surf:#171b24;--surf2:#202633;--ink:#eef0f6;--sub:#8c95a8;--line:#262d3b;--a1:#7aa2ff;--a2:#b48cff;--err:#ff7a85}
@media (prefers-color-scheme:light){:root{--bg:#f6f7fb;--surf:#ffffff;--surf2:#e9ecf4;--ink:#161a24;--sub:#667085;--line:#dfe3ee;--a1:#3b6df0;--a2:#8a55e8;--err:#d33a48}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"SF Pro Text",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.logo{font-size:22px;font-weight:700;letter-spacing:-.3px;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.ib{width:38px;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;padding:0;margin-left:8px}
.hr{display:flex}
#log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 16px 16px;display:flex;flex-direction:column;gap:18px}
.u{align-self:flex-end;max-width:84%;background:var(--surf2);padding:10px 15px;border-radius:20px 20px 6px 20px;white-space:pre-wrap;word-wrap:break-word}
.a{align-self:stretch;word-wrap:break-word;overflow-wrap:anywhere}
.a p{margin:0 0 .6em}.a p:last-child{margin-bottom:0}
.a h4{margin:.8em 0 .3em;font-size:17px}
.a ul,.a ol{margin:0 0 .6em;padding-left:1.3em}
.a code{font:13.5px/1.4 Menlo,monospace;background:var(--surf2);padding:1px 5px;border-radius:5px}
.a pre{background:var(--surf);border:1px solid var(--line);border-radius:12px;padding:12px;margin:.4em 0 .8em;overflow-x:auto;-webkit-overflow-scrolling:touch}
.a pre code{background:none;padding:0;white-space:pre}
.e{align-self:center;color:var(--err);font-size:14px;text-align:center;padding:0 10px}
.dots span{display:inline-block;width:8px;height:8px;margin-right:5px;border-radius:4px;background:var(--a1);animation:b 1s infinite ease-in-out}
.dots span:nth-child(2){animation-delay:.15s;background:var(--a2)}.dots span:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.dots span{animation:none;opacity:.7}}
.hero{margin:auto 0;padding:0 6px}
.hero h1{font-size:30px;line-height:1.15;margin:0 0 6px;letter-spacing:-.6px;background:linear-gradient(90deg,var(--a1),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.hero p{margin:0 0 18px;color:var(--sub)}
.chips{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.chip{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:16px;padding:9px 14px;font-size:15px;text-align:left}
form{display:flex;align-items:flex-end;gap:6px;margin:0 12px calc(10px + env(safe-area-inset-bottom,0px));padding:6px;background:var(--surf);border:1px solid var(--line);border-radius:26px}
textarea{flex:1;resize:none;max-height:130px;border:0;background:none;color:var(--ink);font:16px/1.4 -apple-system,Helvetica,Arial,sans-serif;padding:9px 4px;outline:none}
#att{width:40px;height:40px;border-radius:20px;border:0;background:var(--surf2);color:var(--ink);font-size:24px;line-height:1;padding:0;flex:none}
#th{display:none;gap:8px;margin:0 12px 8px;overflow-x:auto}
.tw{position:relative;flex:none}.tw img{width:64px;height:64px;object-fit:cover;border-radius:12px;display:block}
.tx{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:11px;border:0;background:var(--ink);color:var(--bg);font-size:15px;line-height:1;padding:0}
.u img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin:0 0 6px}
textarea::placeholder{color:var(--sub)}
#send{width:40px;height:40px;border-radius:20px;border:0;background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;font-size:20px;font-weight:700;padding:0;flex:none}
#send:disabled{opacity:.4}
#set{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center;z-index:5}
.box{background:var(--surf);border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));width:100%;max-width:520px}
.box h3{margin:0 0 6px;font-size:19px}
.box label{display:block;font-size:13px;color:var(--sub);margin:14px 0 5px}
.box input{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:16px;background:var(--bg);color:var(--ink);outline:none}
.box .n{font-size:13px;color:var(--sub);margin:12px 0 0}
.row{display:flex;gap:10px;margin-top:18px}
.row button{flex:1;padding:13px;border-radius:14px;border:1px solid var(--line);background:var(--surf2);color:var(--ink);font-size:16px}
.row .ok{background:linear-gradient(135deg,var(--a1),var(--a2));color:#fff;border:0;font-weight:600}
</style>
</head>
<body>
<header>
  <div class="logo">Gemini</div>
  <div class="hr">
    <button class="ib" id="new" aria-label="Yeni sohbet">+</button>
    <button class="ib" id="cfg" aria-label="Ayarlar">&#9881;</button>
  </div>
</header>
<div id="log"></div>
<div id="th"></div>
<form id="f">
  <button id="att" type="button" aria-label="Fotoğraf ekle">+</button>
  <input id="file" type="file" accept="image/*" multiple style="display:none">
  <textarea id="t" rows="1" placeholder="Gemini'ye sor"></textarea>
  <button id="send" type="submit" aria-label="Gönder">&#8593;</button>
</form>
<div id="set">
  <div class="box">
    <h3>Ayarlar</h3>
    <label for="key">API anahtarı</label>
    <input id="key" type="password" autocomplete="off" autocapitalize="off" autocorrect="off">
    <label for="model">Model adı</label>
    <input id="model" type="text" autocapitalize="off" autocorrect="off">
    <p class="n" id="stn">Anahtar sadece bu telefonda saklanır, yalnızca Google'a gönderilir.</p>
    <div class="row"><button id="cancel" type="button">Kapat</button><button id="save" type="button" class="ok">Kaydet</button></div>
  </div>
</div>
<script>
(function(){
  var $=function(i){return document.getElementById(i)};
  var log=$('log'),t=$('t'),send=$('send');
  var DEF='gemini-3.5-flash';
  var mem={},canStore=true;
  try{localStorage.setItem('_t','1');localStorage.removeItem('_t')}catch(e){canStore=false}
  function get(k,d){
    if(canStore){try{var v=localStorage.getItem(k);return v===null?d:v}catch(e){}}
    return mem[k]===undefined?d:mem[k];
  }
  function put(k,v){mem[k]=v;if(canStore){try{localStorage.setItem(k,v)}catch(e){}}}

  var hist=[],busy=false;
  try{hist=JSON.parse(get('hist','[]'))}catch(e){hist=[]}
  function clean(m){var x='',n=0;m.parts.forEach(function(p){if(p.text)x+=p.text;if(p.inlineData)n++});return {role:m.role,parts:[{text:(n?'[Görsel] ':'')+x}]}}
  function save(){put('hist',JSON.stringify(hist.slice(-60).map(clean)))}
  var pending=[];

  function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}

  // satır içi: **kalın** ve `kod`
  function inline(parent,s){
    var re=/(\*\*[^*]+\*\*|`[^`]+`)/g,last=0,m;
    while((m=re.exec(s))){
      if(m.index>last)parent.appendChild(document.createTextNode(s.slice(last,m.index)));
      var x=m[0];
      if(x.charAt(0)==='`')parent.appendChild(el('code','',x.slice(1,-1)));
      else parent.appendChild(el('b','',x.slice(2,-2)));
      last=m.index+x.length;
    }
    if(last<s.length)parent.appendChild(document.createTextNode(s.slice(last)));
  }
  function md(box,text){
    var parts=text.split('```');
    parts.forEach(function(seg,i){
      if(i%2===1){
        var nl=seg.indexOf('\n');
        var code=nl>-1?seg.slice(nl+1):seg;
        var pre=el('pre');pre.appendChild(el('code','',code.replace(/\n$/,'')));
        box.appendChild(pre);return;
      }
      var list=null,lt='';
      seg.split('\n').forEach(function(line){
        var b=/^\s*[-*]\s+(.*)/.exec(line),n=/^\s*\d+[.)]\s+(.*)/.exec(line),h=/^#{1,4}\s+(.*)/.exec(line);
        if(b||n){
          var want=b?'ul':'ol';
          if(!list||lt!==want){list=el(want);lt=want;box.appendChild(list)}
          var li=el('li');inline(li,(b||n)[1]);list.appendChild(li);return;
        }
        list=null;
        if(h){var hh=el('h4');inline(hh,h[1]);box.appendChild(hh);return}
        if(line.trim()===''){return}
        var p=el('p');inline(p,line);box.appendChild(p);
      });
    });
  }

  function addUser(parts){
    var d=el('div','u');
    parts.forEach(function(p){
      if(p.inlineData){var im=document.createElement('img');im.src='data:'+p.inlineData.mimeType+';base64,'+p.inlineData.data;d.appendChild(im)}
      else if(p.text){d.appendChild(document.createTextNode(p.text))}
    });
    log.appendChild(d);scroll();
  }
  function addAI(text){var d=el('div','a');md(d,text);log.appendChild(d);scroll();return d}
  function scroll(){log.scrollTop=log.scrollHeight}

  var tips=['Bana basit bir şekilde yapay zekayı anlat','Bu hafta için yemek planı öner','Kısa bir şiir yaz'];
  function render(){
    log.innerHTML='';
    if(!hist.length){
      var h=el('div','hero');
      h.appendChild(el('h1','','Merhaba, ne öğrenmek istersin?'));
      if(!get('key','')){
        h.appendChild(el('p','','Başlamak için sağ üstteki ayarlardan API anahtarını gir.'));
      }else{
        h.appendChild(el('p','','Aşağıya yaz ya da birini seç.'));
        var c=el('div','chips');
        tips.forEach(function(s){
          var b=el('button','chip',s);b.type='button';
          b.onclick=function(){t.value=s;submit()};
          c.appendChild(b);
        });
        h.appendChild(c);
      }
      log.appendChild(h);return;
    }
    hist.forEach(function(m){
      if(m.role==='user')addUser(m.parts);else addAI(m.parts[0].text);
    });
  }

  function openSet(){
    $('key').value=get('key','');
    $('model').value=get('model',DEF);
    $('stn').textContent=canStore
      ?'Anahtar sadece bu telefonda saklanır, yalnızca Google\'a gönderilir.'
      :'Bu açılış şeklinde telefon kayıt yapamıyor. Sayfayı kapatınca anahtarı yeniden girmen gerekir.';
    $('set').style.display='flex';
  }
  $('cfg').onclick=openSet;
  $('cancel').onclick=function(){$('set').style.display='none'};
  $('save').onclick=function(){
    put('key',$('key').value.trim());
    put('model',$('model').value.trim()||DEF);
    $('set').style.display='none';
    if(!hist.length)render();
  };
  $('new').onclick=function(){if(busy)return;hist=[];save();render()};

  t.addEventListener('input',function(){t.style.height='auto';t.style.height=Math.min(t.scrollHeight,130)+'px'});

  function submit(){
    var text=t.value.trim();
    if((!text&&!pending.length)||busy)return;
    var key=get('key','');
    if(!key){openSet();return}
    if(!hist.length)log.innerHTML='';
    var up=pending.map(function(b){return {inlineData:{mimeType:'image/jpeg',data:b}}});
    if(text)up.push({text:text});
    hist.push({role:'user',parts:up});
    addUser(up);
    pending=[];drawThumbs();
    t.value='';t.style.height='auto';
    busy=true;send.disabled=true;
    var wait=el('div','a');
    var dots=el('div','dots');dots.innerHTML='<span></span><span></span><span></span>';
    wait.appendChild(dots);log.appendChild(wait);scroll();

    var url='https://generativelanguage.googleapis.com/v1beta/models/'+
      encodeURIComponent(get('model',DEF))+':generateContent?key='+encodeURIComponent(key);

    fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:hist})})
    .then(function(r){return r.json()})
    .then(function(data){
      if(data.error)throw new Error(data.error.message||'Bilinmeyen hata');
      var c=data.candidates&&data.candidates[0];
      var parts=(c&&c.content&&c.content.parts)||[];
      var out=parts.map(function(p){return p.text||''}).join('');
      if(!out)throw new Error('Boş cevap geldi. Soruyu başka şekilde dene.');
      wait.innerHTML='';md(wait,out);
      hist.push({role:'model',parts:[{text:out}]});
      save();
    })
    .catch(function(err){
      wait.className='e';wait.innerHTML='';
      wait.textContent='Hata: '+err.message;
      hist.pop();
    })
    .then(function(){busy=false;send.disabled=false;scroll()});
  }
  function shrink(f,cb){
    var r=new FileReader();
    r.onload=function(){
      var im=new Image();
      im.onload=function(){
        var w=im.naturalWidth,h=im.naturalHeight,k=Math.min(1,1280/Math.max(w,h));
        var c=document.createElement('canvas');c.width=Math.round(w*k);c.height=Math.round(h*k);
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        cb(c.toDataURL('image/jpeg',0.8).split(',')[1]);
      };
      im.onerror=function(){cb(null)};
      im.src=r.result;
    };
    r.onerror=function(){cb(null)};
    r.readAsDataURL(f);
  }
  function drawThumbs(){
    var th=$('th');th.innerHTML='';
    pending.forEach(function(b,i){
      var w=el('div','tw'),im=document.createElement('img');
      im.src='data:image/jpeg;base64,'+b;
      var x=el('button','tx','\u00d7');x.type='button';
      x.onclick=function(){pending.splice(i,1);drawThumbs()};
      w.appendChild(im);w.appendChild(x);th.appendChild(w);
    });
    th.style.display=pending.length?'flex':'none';
  }
  $('att').onclick=function(){$('file').click()};
  $('file').addEventListener('change',function(){
    var inp=this,files=Array.prototype.slice.call(inp.files).slice(0,Math.max(0,4-pending.length));
    files.forEach(function(f){
      shrink(f,function(b){if(b&&pending.length<4){pending.push(b);drawThumbs()}});
    });
    inp.value='';
  });
  $('f').addEventListener('submit',function(ev){ev.preventDefault();submit()});

  render();
})();
</script>
</body>
</html>
